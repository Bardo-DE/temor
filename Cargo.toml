[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.dependencies]
# bardo, pinned by tag (.git + tag).
ui-components = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-core = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
base-words = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-style = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-blitz = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-host-hooks = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-desktop = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-intents = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-harness = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-lint = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-settings = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
settings-types = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
settings-store = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
settings-store-fs = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-settings-page = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
ui-emoji = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
# Copied from bardo's crates/ui/docs/workspace-deps.toml at the tag above.
dioxus = { version = "0.8.0-alpha.3", default-features = false, features = ["macro", "html", "hooks", "signals"] }
serde = { version = "1", features = ["derive"] }
unicode-width = "0.2"
serde_json = { version = "1" }
thiserror = { version = "2" }
proptest = { version = "1" }
# The Unicode property oracle in temor-core's sanitising tests (dev only).
icu_properties = "2"
png = { version = "0.18" }
# temor-vt (lane vt).
temor-vt-sys = { path = "crates/temor-vt-sys", default-features = false }
temor-vt = { path = "crates/temor-vt", default-features = false }
# temor-render (lane render). Versions are the ones bardo's UI kit resolves at the pin above:
# fontique as parley 0.11 uses it, swash on the same skrifa (0.44) as vello's glifo, vello_cpu 0.1
# (the patched fork below; no second vello), wgpu 29 as the UI kit's render stack.
fontique = { version = "0.13" }
swash = "0.2"
vello_cpu = { version = "0.4", features = ["std", "text", "u8_pipeline"], default-features = false }
wgpu = { version = "30" }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
temor-render = { path = "crates/temor-render", default-features = false }
temor-ssh = { path = "crates/temor-ssh", default-features = false }
# temor's app crates (lane app): the pure core, the pseudo-terminal, and the window.
temor-core = { path = "crates/temor-core" }
temor-blocks = { path = "crates/temor-blocks" }
temor-layout = { path = "crates/temor-layout" }
temor-hosts = { path = "crates/temor-hosts" }
temor-agent = { path = "crates/temor-agent" }
temor-schema = { path = "crates/temor-schema" }
temor-store = { path = "crates/temor-store" }
temor-client = { path = "crates/temor-client" }
temor-panes = { path = "crates/temor-panes" }
# temor-store: SQLite, built in (FTS5 included), with the commit hook that says a write is visible.
rusqlite = { version = "0.43", features = ["bundled", "hooks"] }
bitflags = { version = "2" }
parking_lot = "0.12"
# temor-client: another process's commits are heard by watching the store's file. The version
# bardo's ui-settings already locks.
notify = { version = "8.2" }
temor-pty = { path = "crates/temor-pty" }
temor-shell = { path = "crates/temor-shell", default-features = false }
temor-pane = { path = "crates/temor-pane", default-features = false }
temor-ui = { path = "crates/temor-ui" }
temor-ui-base = { path = "crates/temor-ui-base" }
temor-hub = { path = "crates/temor-hub" }
temor-views = { path = "crates/temor-views" }
temor-pane-view = { path = "crates/temor-pane-view" }
# temor-plugins (lane plugins): P11 on bardo's plugin-host. A plugin is run, never linked.
plugin-host = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
temor-plugins = { path = "crates/temor-plugins" }
# temor-transfer (lane blocks): the downloads shelf's store, for "Save output".
temor-transfer = { path = "crates/temor-transfer" }
# Test helpers shared by every crate's tests (L0; dev-dependency only).
temor-testkit = { path = "crates/temor-testkit" }
tokio = { version = "1", features = ["sync"], default-features = false }
# temor-remote (lane remote): the wire protocol it speaks, and SHA-256 for file stamps and the helper's identity.
temor-wire = { path = "crates/temor-wire" }
# temor-ui (lane remote): the helper's client, for Tier B sessions in the window.
temor-remote = { path = "crates/temor-remote", default-features = false }
sha2 = { version = "0.10" }
# anyview's viewer pane and peeks (PLAN §10, D13). Same bardo tag as above.
anyview-core = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
anyview-fs = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
anyview-peek = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
anyview-machines = { git = "https://github.com/Bardo-DE/anyview.git", rev = "6c0b5d57dcfef3a474d6f768fdf0235088a14545" }
anyview-pane = { git = "https://github.com/Bardo-DE/anyview.git", rev = "6c0b5d57dcfef3a474d6f768fdf0235088a14545" }
# The desktop's portable keymap core (actions, chords, Primary per platform); temor owns no keymap.
keymap = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }

# temor-desktop (lane desktop): the only crate that names zbus and bardo's intents and accounts clients (PLAN §2).
# Both come from the one bardo tag, so they share one account-core. The accounts client is
# feature `dbus` only: no inference, no model layer.
temor-desktop = { path = "crates/temor-desktop", default-features = false }
action-provider = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2", features = ["dbus"], default-features = false }
action-vocab = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
action-wire = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
action-manifest = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
account-tailscale = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
caller-role-types = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
base-ids = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
action-core = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
# Who may call temor's provider (the intents router's unit), and the stand-in a test names for it.
action-dbus = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
provenance = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
account-core = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
account-client = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
account-client-dbus = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
# The Secret Service store a Space's secrets are kept in (temor-desktop only), under temor's own name.
account-secrets = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2", features = ["oo7"] }
# zbus on tokio, as bardo's intents and accounts crates build it (bardo's crates/ui/CONSUMING.md §1: a program that owns a tokio runtime).
# caller identity: which program is calling (a pinned process judged against a table), as bardo's
# accounts and intents crates use it, by the same tag; temor-desktop checks the caller of `org.bardo.Temor1.Run` with it.
caller-identity-dbus = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2", features = ["tokio"], default-features = false }
caller-identity-core = { git = "https://github.com/Bardo-DE/bardo", tag = "v0.1.2" }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
toml = { version = "1" }
# The tests of temor-desktop read bus signals as streams.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# temor-pty: openpty, spawn, resize and process groups without `unsafe` (rustix is already in bardo's tree).
# temor-pty: the person's login shell through the system's account lookup (NSS: files, LDAP, sssd,
# systemd-homed), not by reading /etc/passwd.
nix = { version = "0.31", default-features = false, features = ["user", "term", "process", "socket"] }
rustix = { version = "1.1", default-features = false, features = ["std", "pty", "termios", "process", "fs", "event"] }
# temor-pty on macOS: process name, directory, children and start time through proc_pidinfo (safe wrappers).
libproc = "0.14"
tempfile = { version = "3" }
# Small shared codecs (temor-transfer, temor-ssh, temor-vt's fake, temor-pane): base64 and
# percent coding, at the versions already in the lock file.
base64 = { version = "0.22" }
percent-encoding = { version = "2.3" }
# The plain line diff of an edit conflict (MIT/Apache-2.0; no dependencies without its optional features).
jiff = { version = "0.2" }
similar = { version = "2", default-features = false, features = ["text"] }

# Release binaries carry no symbol table (a third of temor's size, never loaded; a panic still
# names its file and line). Same speed.
[profile.release]
strip = true

# What a published release is built with (scripts/package.sh): one codegen unit and thin LTO let
# the compiler work across crates, for a binary about 11% smaller and as fast or faster, at about
# three more minutes of linking and a 5 GB peak. Day-to-day release builds stay on `release`.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# Patches apply only at a workspace root, so this root repeats bardo's block (bardo's root
# Cargo.toml says what each fork carries): vello, anyrender and dioxus come from the Bardo-DE forks,
# pdfrum-anyrender from pdfrum's own repository. Move back to crates.io once upstream has them.

[patch.crates-io]
anyrender = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
anyrender_svg = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
anyrender_vello_cpu = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
anyrender_vello_gpu = {git = "https://github.com/Bardo-DE/anyrender", rev = "a494b4848f971650cd9fb54fe06bec4dda7805a3"}
dioxus = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-asset-resolver = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-cli-config = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-config-macros = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-const-vec = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-core = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-core-macro = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-core-template = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-core-types = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-document = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-history = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-hooks = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-html = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-html-internal-macro = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-rsx = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-signals = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-stores = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
dioxus-stores-macro = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
generational-box = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
glifo = {git = "https://github.com/Bardo-DE/vello", rev = "b73a8dfa23c4e34eeda7f73c1bb2beb10ead5a6a"}
lazy-js-bundle = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
pdfrum-anyrender = {git = "https://github.com/PoHsuanLai/pdfrum", rev = "dea36b2adf11c1a53f5e92bfdafeba17cdf2b1de"}
subsecond = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
subsecond-types = {git = "https://github.com/Bardo-DE/dioxus", rev = "c846221c5e4ca7a6c356a7b5df95cbe79525e247"}
vello_common = {git = "https://github.com/Bardo-DE/vello", rev = "b73a8dfa23c4e34eeda7f73c1bb2beb10ead5a6a"}
vello_cpu = {git = "https://github.com/Bardo-DE/vello", rev = "b73a8dfa23c4e34eeda7f73c1bb2beb10ead5a6a"}
